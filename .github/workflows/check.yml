name: check

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bash syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n tests/test-extraction-ownership.sh
      - name: Run ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -x install.sh uninstall.sh tests/test-extraction-ownership.sh
      - name: Test safe archive extraction
        run: sudo bash tests/test-extraction-ownership.sh

